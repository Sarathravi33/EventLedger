spring:
  application:
    # Service name appears in structured log output to identify the source of each log line
    name: account-service

  datasource:
    # In-memory H2 database, isolated to this service.
    # This is a completely separate database from the Event Gateway's —
    # the two services share no data store, no schema, and no in-process state.
    # DB_CLOSE_DELAY=-1  : keeps the database alive as long as the JVM is running
    # DB_CLOSE_ON_EXIT=FALSE : prevents H2 from shutting down when the last connection closes
    url: jdbc:h2:mem:accountservicedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # create-drop: schema is created from @Entity classes on startup and dropped on shutdown.
      # Appropriate for in-memory databases — no migration files needed.
      ddl-auto: create-drop
    # Set to true temporarily to inspect generated SQL during development
    show-sql: false

  h2:
    console:
      # H2 web console for inspecting the in-memory database during development.
      # Access at: http://localhost:8081/h2-console
      # JDBC URL to enter: jdbc:h2:mem:accountservicedb
      enabled: true
      path: /h2-console

  jackson:
    # Serialize Instant (and other java.time types) as ISO-8601 strings
    # (e.g. "2026-05-15T14:02:11Z") instead of epoch-second numbers.
    serialization:
      write-dates-as-timestamps: false
    # Omit null fields from all JSON responses.
    default-property-inclusion: non_null

server:
  port: 8081

management:
  tracing:
    sampling:
      # 100% sampling: every request gets a traceId in the logs.
      # Reduce to 0.1 (10%) in high-traffic production environments.
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: "health,metrics,info"
  endpoint:
    health:
      show-details: always

# Log levels are configured in logback-spring.xml (com.eventledger at DEBUG,
# everything else at INFO). logback-spring.xml also sets the JSON format with
# traceId and spanId included in every line via LogstashEncoder + MDC.
