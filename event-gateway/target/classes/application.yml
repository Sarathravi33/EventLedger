spring:
  application:
    # Service name appears in structured log output to identify the source of each log line
    name: event-gateway

  datasource:
    # In-memory H2 database, isolated to this service.
    # DB_CLOSE_DELAY=-1  : keeps the database alive as long as the JVM is running
    # DB_CLOSE_ON_EXIT=FALSE : prevents H2 from shutting down when the last connection closes
    url: jdbc:h2:mem:eventgatewaydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # create-drop: schema is created from @Entity classes on startup and dropped on shutdown.
      # Appropriate for in-memory databases — no migration files needed.
      ddl-auto: create-drop
    # Set to true temporarily to inspect generated SQL during development
    show-sql: false

  h2:
    console:
      # H2 web console for inspecting the in-memory database during development.
      # Access at: http://localhost:8080/h2-console
      # JDBC URL to enter: jdbc:h2:mem:eventgatewaydb
      enabled: true
      path: /h2-console

  jackson:
    # Serialize Instant (and other java.time types) as ISO-8601 strings
    # (e.g. "2026-05-15T14:02:11Z") instead of epoch-second numbers.
    # Requires Jackson's JavaTimeModule, which Spring Boot auto-configures.
    serialization:
      write-dates-as-timestamps: false
    # Omit null fields from all JSON responses (e.g. metadata when not present).
    default-property-inclusion: non_null

server:
  port: 8080

# Base URL of the Account Service — used by AccountServiceClient.
# Override with ACCOUNT_SERVICE_BASE_URL environment variable when running in Docker.
account-service:
  base-url: ${ACCOUNT_SERVICE_BASE_URL:http://localhost:8081}

management:
  tracing:
    sampling:
      # 100% sampling: every request gets a traceId in the logs.
      # Reduce to 0.1 (10%) in high-traffic production environments.
      probability: 1.0
  endpoints:
    web:
      exposure:
        # Expose health (includes circuit breaker state), metrics, and info.
        include: "health,metrics,info"
  endpoint:
    health:
      # Show individual component health (database, circuit breaker) in /actuator/health.
      show-details: always

# Circuit breaker configuration for the Account Service call.
# resilience4j-spring-boot3 auto-configures a CircuitBreaker instance named
# "accountService" from these properties, matching @CircuitBreaker(name="accountService")
# in AccountServiceClient.
resilience4j:
  circuitbreaker:
    instances:
      accountService:
        # Evaluate failure rate over the last 10 calls (COUNT_BASED window).
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        # Open the circuit when 50% or more of the last 10 calls fail.
        failure-rate-threshold: 50
        # Stay OPEN for 10 seconds before transitioning to HALF_OPEN.
        wait-duration-in-open-state: 10s
        # In HALF_OPEN state, allow 3 probe calls before deciding to close or re-open.
        permitted-number-of-calls-in-half-open-state: 3
        # Expose circuit breaker state via /actuator/health (added in Step 11).
        register-health-indicator: true

# Log levels are configured in logback-spring.xml (com.eventledger at DEBUG,
# everything else at INFO). logback-spring.xml also sets the JSON format with
# traceId and spanId included in every line via LogstashEncoder + MDC.
